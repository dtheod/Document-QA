services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      # MLflow server on the host (backend/scripts/mlflow-server.sh) that receives the traces
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5001
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker Desktop has it built in; Linux needs this
    # Restart policy
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
