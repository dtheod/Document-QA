name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only, no push. Layers are cached in GitHub Actions, so the slow dependency
      # install only reruns when uv.lock or package-lock.json changes
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  backend:
    name: Backend tests
    needs: docker  # run the tests only once both images build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Offline tests fake the LLM and embeddings; tests/conftest.py sets a placeholder
      # OpenAI key and the integration tests (real API calls) are deselected below
      ANONYMIZED_TELEMETRY: "False"  # Chroma
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run offline tests
        run: uv run pytest -m "not integration"
