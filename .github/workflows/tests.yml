name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Offline tests fake the LLM and embeddings; tests/conftest.py sets a placeholder
      # OpenAI key and the integration tests (real API calls) are deselected below
      ANONYMIZED_TELEMETRY: "False"  # Chroma
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run offline tests
        run: uv run pytest -m "not integration"
